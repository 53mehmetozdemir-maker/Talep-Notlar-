name: Yayinla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyAuSzUO0Ru9DP_ffGJLE7eNGjFJn3KLQ68
      VITE_FIREBASE_AUTH_DOMAIN: talep-notlari.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: talep-notlari
      VITE_FIREBASE_STORAGE_BUCKET: talep-notlari.firebasestorage.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Paketleri kur
        run: npm ci || (rm -rf node_modules package-lock.json && npm install)
      - name: Tip kontrolu
        run: npx tsc -b
      - name: Derleme
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4